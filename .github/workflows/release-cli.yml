name: release-cli

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # A pure-Go CLI cross-compiles all five platforms from one Linux runner
    # (cli/README.md) — the OS-native exception does NOT apply here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest

      - name: Snapshot dry run
        run: goreleaser release --snapshot --clean

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to the homebrew-tap and scoop-bucket repos.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: goreleaser release --clean
